<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </radialGradient>
    <linearGradient id="eg" x1="50%" y1="100%" x2="40%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <linearGradient id="cg" x1="16" y1="6" x2="16" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#60A5FA"/>
      <stop offset="55%"  stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="16" cy="16" r="16" fill="url(#bg)"/>

  <!--
    Ears: all vertices at r≥10 from center (16,16).
    Left ear: (7,10)→r=10.8, (5,2)→r=17.8, (13,6)→r=10.4  ✓
    Midpoint of base (7,10)-(13,6) = (10,8) → r=10.0, tangent to face circle ✓
  -->

  <!-- Left ear outer -->
  <path d="M 7 10 Q 5 1.5 13 6 Z" fill="url(#eg)"/>
  <!-- Left ear inner -->
  <path d="M 8 9.5 Q 7 3.5 12 6.5 Z" fill="#BFDBFE"/>

  <!-- Right ear outer — symmetric about x=16 -->
  <path d="M 25 10 Q 27 1.5 19 6 Z" fill="url(#eg)"/>
  <!-- Right ear inner -->
  <path d="M 24 9.5 Q 25 3.5 20 6.5 Z" fill="#BFDBFE"/>

  <!-- C face outline -->
  <path d="M 23 9 A 10 10 0 1 0 23 23"
    stroke="url(#cg)" stroke-width="4.8" stroke-linecap="round" fill="none"/>

  <!-- Eyes -->
  <circle cx="13" cy="15" r="2.1" fill="#1E3A8A"/>
  <circle cx="19" cy="15" r="2.1" fill="#1E3A8A"/>
  <circle cx="13.8" cy="14.2" r="0.8" fill="white"/>
  <circle cx="19.8" cy="14.2" r="0.8" fill="white"/>

  <!-- Smile -->
  <path d="M 11.5 21 Q 16 25.5 20.5 21"
    stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Blush -->
  <ellipse cx="10"  cy="20.5" rx="2" ry="1.1" fill="#FCA5A5" opacity="0.45"/>
  <ellipse cx="22"  cy="20.5" rx="2" ry="1.1" fill="#FCA5A5" opacity="0.45"/>
</svg>
