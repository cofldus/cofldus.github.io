<svg width="800" height="320" viewBox="0 0 800 320" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">

  <!-- Background -->
  <rect width="800" height="320" fill="#FAFAFA"/>

  <!-- Stage label band -->
  <rect x="0" y="0" width="800" height="28" fill="#F1F5F9"/>
  <text x="75" y="18" font-size="9" font-weight="600" fill="#4fc0d1" text-anchor="middle" letter-spacing="1">코퍼스</text>
  <text x="270" y="18" font-size="9" font-weight="600" fill="#4fc0d1" text-anchor="middle" letter-spacing="1">하이브리드 검색</text>
  <text x="490" y="18" font-size="9" font-weight="600" fill="#4fc0d1" text-anchor="middle" letter-spacing="1">리랭킹</text>
  <text x="630" y="18" font-size="9" font-weight="600" fill="#4fc0d1" text-anchor="middle" letter-spacing="1">생성</text>
  <text x="750" y="18" font-size="9" font-weight="600" fill="#4fc0d1" text-anchor="middle" letter-spacing="1">출력</text>

  <!-- Stage dividers -->
  <line x1="152" y1="0" x2="152" y2="320" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="390" y1="0" x2="390" y2="320" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="556" y1="0" x2="556" y2="320" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="702" y1="0" x2="702" y2="320" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Node 1: 의학 코퍼스 -->
  <rect x="20" y="110" width="112" height="72" rx="8" fill="#F0FDFF" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="20" y="110" width="112" height="8" rx="8" fill="#4fc0d1" opacity="0.7"/>
  <rect x="20" y="114" width="112" height="4" fill="#4fc0d1" opacity="0.7"/>
  <text x="76" y="142" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle">의학 코퍼스</text>
  <text x="76" y="158" font-size="10" fill="#64748B" text-anchor="middle">5.5만건 JSON</text>
  <text x="76" y="172" font-size="9" fill="#94A3B8" text-anchor="middle">RAG 지식베이스</text>

  <!-- Arrow 1→split -->
  <line x1="132" y1="146" x2="168" y2="146" stroke="#4fc0d1" stroke-width="1.5"/>
  <polygon points="168,142 176,146 168,150" fill="#4fc0d1"/>

  <!-- Fork line up -->
  <line x1="176" y1="146" x2="176" y2="100" stroke="#4fc0d1" stroke-width="1.5"/>
  <line x1="176" y1="100" x2="196" y2="100" stroke="#4fc0d1" stroke-width="1.5"/>
  <!-- Fork line down -->
  <line x1="176" y1="146" x2="176" y2="196" stroke="#4fc0d1" stroke-width="1.5"/>
  <line x1="176" y1="196" x2="196" y2="196" stroke="#4fc0d1" stroke-width="1.5"/>

  <!-- Node 2a: BM25 -->
  <rect x="196" y="68" width="126" height="64" rx="8" fill="#F0FDF4" stroke="#CBD5E1" stroke-width="1"/>
  <text x="259" y="96" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle">BM25</text>
  <text x="259" y="112" font-size="10" fill="#64748B" text-anchor="middle">k=20 용어 매칭</text>
  <text x="259" y="125" font-size="9" fill="#94A3B8" text-anchor="middle">Sparse Retrieval</text>

  <!-- Node 2b: FAISS -->
  <rect x="196" y="164" width="126" height="64" rx="8" fill="#FFF7ED" stroke="#CBD5E1" stroke-width="1"/>
  <text x="259" y="192" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle">FAISS</text>
  <text x="259" y="208" font-size="10" fill="#64748B" text-anchor="middle">k=20 의미 검색</text>
  <text x="259" y="221" font-size="9" fill="#94A3B8" text-anchor="middle">Dense Retrieval</text>

  <!-- Merge arrows to reranker -->
  <line x1="322" y1="100" x2="358" y2="100" stroke="#4fc0d1" stroke-width="1.5"/>
  <line x1="358" y1="100" x2="358" y2="182" stroke="#4fc0d1" stroke-width="1.5"/>
  <line x1="322" y1="196" x2="358" y2="196" stroke="#4fc0d1" stroke-width="1.5"/>
  <line x1="358" y1="196" x2="358" y2="182" stroke="#4fc0d1" stroke-width="1.5"/>
  <line x1="358" y1="182" x2="400" y2="182" stroke="#4fc0d1" stroke-width="1.5"/>
  <polygon points="400,178 408,182 400,186" fill="#4fc0d1"/>

  <!-- Node 3: Reranker -->
  <rect x="408" y="146" width="132" height="72" rx="8" fill="#F5F3FF" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="408" y="146" width="132" height="8" rx="8" fill="#4fc0d1" opacity="0.5"/>
  <rect x="408" y="150" width="132" height="4" fill="#4fc0d1" opacity="0.5"/>
  <text x="474" y="178" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle">bge-reranker</text>
  <text x="474" y="194" font-size="10" fill="#64748B" text-anchor="middle">Top-40 → Top-5</text>
  <text x="474" y="208" font-size="9" fill="#94A3B8" text-anchor="middle">Cross-Encoder 정밀 선별</text>

  <!-- Arrow 3→4 -->
  <line x1="540" y1="182" x2="570" y2="182" stroke="#4fc0d1" stroke-width="1.5"/>
  <polygon points="570,178 578,182 570,186" fill="#4fc0d1"/>

  <!-- Node 4: EXAONE LLM -->
  <rect x="578" y="146" width="114" height="72" rx="8" fill="#F0FDFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="635" y="174" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle">EXAONE-3.5</text>
  <text x="635" y="190" font-size="10" fill="#64748B" text-anchor="middle">LLM 생성</text>
  <text x="635" y="206" font-size="9" fill="#94A3B8" text-anchor="middle">의료 도메인 특화</text>

  <!-- Arrow 4→5 -->
  <line x1="692" y1="182" x2="718" y2="182" stroke="#4fc0d1" stroke-width="1.5"/>
  <polygon points="718,178 726,182 718,186" fill="#4fc0d1"/>

  <!-- Node 5: Output -->
  <rect x="726" y="146" width="54" height="72" rx="8" fill="#F0FDF4" stroke="#4fc0d1" stroke-width="1.5"/>
  <text x="753" y="176" font-size="10" font-weight="700" fill="#1E293B" text-anchor="middle">의료</text>
  <text x="753" y="190" font-size="10" font-weight="700" fill="#1E293B" text-anchor="middle">자문</text>
  <text x="753" y="204" font-size="10" font-weight="700" fill="#1E293B" text-anchor="middle">답변</text>

  <!-- Title -->
  <text x="400" y="280" font-size="13" font-weight="700" fill="#1E293B" text-anchor="middle">이지스-바이오 센티넬스 의료자문봇</text>
  <text x="400" y="298" font-size="10" fill="#94A3B8" text-anchor="middle">Hybrid RAG · BM25 + FAISS · bge-reranker · EXAONE-3.5</text>

</svg>
