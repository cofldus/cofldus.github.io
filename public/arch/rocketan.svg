<svg width="800" height="320" viewBox="0 0 800 320" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">

  <!-- Background -->
  <rect width="800" height="320" fill="#FAFAFA"/>

  <!-- Stage label band -->
  <rect x="0" y="0" width="800" height="28" fill="#F1F5F9"/>
  <text x="52" y="18" font-size="9" font-weight="600" fill="#4fc0d1" text-anchor="middle" letter-spacing="1">입력</text>
  <text x="188" y="18" font-size="9" font-weight="600" fill="#4fc0d1" text-anchor="middle" letter-spacing="1">파싱</text>
  <text x="350" y="18" font-size="9" font-weight="600" fill="#4fc0d1" text-anchor="middle" letter-spacing="1">인덱싱</text>
  <text x="530" y="18" font-size="9" font-weight="600" fill="#4fc0d1" text-anchor="middle" letter-spacing="1">검색·생성</text>
  <text x="720" y="18" font-size="9" font-weight="600" fill="#4fc0d1" text-anchor="middle" letter-spacing="1">출력</text>

  <!-- Stage dividers -->
  <line x1="108" y1="0" x2="108" y2="320" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="264" y1="0" x2="264" y2="320" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="432" y1="0" x2="432" y2="320" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="640" y1="0" x2="640" y2="320" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Node 1: 강의 문서 업로드 -->
  <rect x="8" y="112" width="100" height="76" rx="8" fill="#F0FDFF" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="8" y="112" width="100" height="8" rx="8" fill="#4fc0d1" opacity="0.7"/>
  <rect x="8" y="116" width="100" height="4" fill="#4fc0d1" opacity="0.7"/>
  <text x="58" y="142" font-size="11" font-weight="700" fill="#1E293B" text-anchor="middle">강의 문서</text>
  <text x="58" y="157" font-size="11" font-weight="700" fill="#1E293B" text-anchor="middle">업로드</text>
  <text x="58" y="174" font-size="9" fill="#94A3B8" text-anchor="middle">PDF / PPT</text>

  <!-- Arrow 1→2 -->
  <line x1="108" y1="150" x2="124" y2="150" stroke="#4fc0d1" stroke-width="1.5"/>
  <polygon points="124,146 132,150 124,154" fill="#4fc0d1"/>

  <!-- Node 2: pdfplumber 파싱 -->
  <rect x="132" y="112" width="124" height="76" rx="8" fill="#FFF7ED" stroke="#CBD5E1" stroke-width="1"/>
  <text x="194" y="142" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle">pdfplumber</text>
  <text x="194" y="158" font-size="10" fill="#64748B" text-anchor="middle">텍스트 파싱</text>
  <text x="194" y="174" font-size="9" fill="#94A3B8" text-anchor="middle">레이아웃 보존 추출</text>

  <!-- Arrow 2→3 -->
  <line x1="256" y1="150" x2="276" y2="150" stroke="#4fc0d1" stroke-width="1.5"/>
  <polygon points="276,146 284,150 276,154" fill="#4fc0d1"/>

  <!-- Node 3: 청크 분할 + FAISS -->
  <rect x="284" y="94" width="140" height="112" rx="8" fill="#F5F3FF" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="284" y="94" width="140" height="8" rx="8" fill="#4fc0d1" opacity="0.5"/>
  <rect x="284" y="98" width="140" height="4" fill="#4fc0d1" opacity="0.5"/>
  <text x="354" y="124" font-size="11" font-weight="700" fill="#1E293B" text-anchor="middle">청크 분할</text>
  <text x="354" y="140" font-size="9" fill="#64748B" text-anchor="middle">256토큰 / overlap 32</text>
  <line x1="296" y1="152" x2="412" y2="152" stroke="#CBD5E1" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="354" y="168" font-size="11" font-weight="700" fill="#1E293B" text-anchor="middle">FAISS 인덱스</text>
  <text x="354" y="184" font-size="9" fill="#64748B" text-anchor="middle">강의별 독립 인덱스</text>

  <!-- Arrow 3→4 -->
  <line x1="424" y1="150" x2="448" y2="150" stroke="#4fc0d1" stroke-width="1.5"/>
  <polygon points="448,146 456,150 448,154" fill="#4fc0d1"/>

  <!-- Node 4: LangChain RetrievalQA -->
  <rect x="456" y="112" width="176" height="76" rx="8" fill="#F0FDF4" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="456" y="112" width="176" height="8" rx="8" fill="#4fc0d1" opacity="0.5"/>
  <rect x="456" y="116" width="176" height="4" fill="#4fc0d1" opacity="0.5"/>
  <text x="544" y="142" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle">LangChain</text>
  <text x="544" y="158" font-size="10" fill="#64748B" text-anchor="middle">RetrievalQA Chain</text>
  <text x="544" y="174" font-size="9" fill="#94A3B8" text-anchor="middle">LLM + Vector 검색 통합</text>

  <!-- Fork to outputs -->
  <line x1="632" y1="150" x2="652" y2="150" stroke="#4fc0d1" stroke-width="1.5"/>
  <line x1="652" y1="150" x2="652" y2="108" stroke="#4fc0d1" stroke-width="1.5"/>
  <line x1="652" y1="108" x2="668" y2="108" stroke="#4fc0d1" stroke-width="1.5"/>
  <line x1="652" y1="150" x2="652" y2="196" stroke="#4fc0d1" stroke-width="1.5"/>
  <line x1="652" y1="196" x2="668" y2="196" stroke="#4fc0d1" stroke-width="1.5"/>

  <!-- Node 5a: 퀴즈 -->
  <rect x="668" y="74" width="120" height="68" rx="8" fill="#F0FDFF" stroke="#4fc0d1" stroke-width="1.2"/>
  <text x="728" y="100" font-size="11" font-weight="700" fill="#1E293B" text-anchor="middle">퀴즈 생성</text>
  <text x="728" y="116" font-size="9" fill="#64748B" text-anchor="middle">객관식 · 서술형</text>
  <text x="728" y="132" font-size="9" fill="#94A3B8" text-anchor="middle">자동 문항 생성</text>

  <!-- Node 5b: 학습 가이드 -->
  <rect x="668" y="162" width="120" height="68" rx="8" fill="#FFF7ED" stroke="#4fc0d1" stroke-width="1.2"/>
  <text x="728" y="188" font-size="11" font-weight="700" fill="#1E293B" text-anchor="middle">학습 가이드</text>
  <text x="728" y="204" font-size="9" fill="#64748B" text-anchor="middle">핵심개념 정리</text>
  <text x="728" y="220" font-size="9" fill="#94A3B8" text-anchor="middle">구조화 요약</text>

  <!-- Title -->
  <text x="400" y="278" font-size="13" font-weight="700" fill="#1E293B" text-anchor="middle">STT 강의 스크립트 퀴즈·학습 가이드 자동 생성기</text>
  <text x="400" y="296" font-size="10" fill="#94A3B8" text-anchor="middle">pdfplumber · FAISS 인덱싱 · LangChain RetrievalQA · 자동 문항 생성</text>

</svg>
