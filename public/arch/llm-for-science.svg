  <text x="400" y="18" font-size="9" font-weight="600" fill="#4fc0d1" text-anchor="middle" letter-spacing="1">LLM FOR SCIENCE — CPT · GDPO 연구 파이프라인</text>

  <!-- ─── PHASE 1 ─── -->
