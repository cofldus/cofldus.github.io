  <text x="38" y="100" font-size="8" fill="#0E7490" text-anchor="middle">데이터</text>
  <line x1="70" y1="38" x2="70" y2="116" stroke="#CBD5E1" stroke-width="1"/>

  <!-- P1 Node 1: arXiv·PubMed -->
  <rect x="80" y="50" width="126" height="54" rx="8" fill="white" stroke="#CBD5E1" stroke-width="1"/>
  <text x="143" y="73" font-size="11" font-weight="700" fill="#1E293B" text-anchor="middle">arXiv · PubMed</text>
